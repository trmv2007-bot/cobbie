plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

// No splitEnvironmentSourceSets: single sourceset so the client entrypoint class is on the main
// classpath (avoids client-entrypoint ClassNotFoundException).
//
// No explicit `loom { mods { "cobbie" { ... } } }` block: Loom 1.17 auto-discovers the mod from
// src/main/resources/fabric.mod.json and registers it against the main source set. Declaring it by
// hand as well makes fabricApi.configureTests fail with "Cannot add a ModSettings with name
// 'cobbie' as a ModSettings with that name already exists."

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// MC 26.x is fully unobfuscated — no mappings, no remapping.
	// Non-remapped Loom: use plain implementation, not modImplementation.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Fabric message API (server chat events) — for Cobbie's chat brain
	include(implementation("net.fabricmc.fabric-api:fabric-message-api-v1:7.0.10+3434d6d95d"))

	// JUnit 5 for unit tests
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

test {
	useJUnitPlatform()
	// Live provider checks stay out of the hermetic suite unless asked for:
	//   ./gradlew test --tests '*LiveProviderTest*' -Dcobbie.live=1
	// The key is read from the gitignored config/cobbie.json on this machine, never from a flag.
	systemProperty 'cobbie.live', System.getProperty('cobbie.live', '0')
}

// In-game tests. The client gametest harness boots a real Fabric 26.3 client, creates a world,
// drives it, screenshots it and asserts — the only tier that proves an in-game behaviour.
// Tests live in src/gametest/java (Loom creates that source set, not src/clientGameTest).
// Run with: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "cobbie"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
		username = "TestPlayer"
	}
}

// ---------------------------------------------------------------------------------------------
// Running a client game test on this machine
//
// `clearRunDirectory = false` is deliberate: the run directory holds the 1.7 GB asset cache under
// `downloads/`, and wiping it turns every run into a re-download. What it also holds is a world per
// previous run, so the preflight deletes `saves/` and nothing else: one run, one world, no state
// carried in from last time.
//
// The other obstacle is the GPU. This is an 8 GB card and Ollama keeps lfm2.5:8b resident on ~6.2 GB
// of it between requests; a live Minecraft client takes the rest. A second client then dies mid-way
// through allocating its texture atlases, which looks exactly like a renderer bug and is not one.
// tools/gametest-preflight.ps1 refuses that situation with a sentence, unloads the model, and checks
// the headroom that is actually available before the client boots.
//
//   ./gradlew runClientGameTest                          # the whole suite
//   ./gradlew runClientGameTest -PcobbieTests=Status     # one class (comma-separated for several)
//   ./gradlew runClientGameTest -PskipGametestPreflight  # only if the guard is wrong about something
// ---------------------------------------------------------------------------------------------
tasks.register("gametestPreflight") {
	group = "verification"
	description = "Clears last run's worlds and refuses to boot a game-test client onto a GPU that is already occupied."

	def script = file("tools/gametest-preflight.ps1")
	def savesDir = layout.buildDirectory.dir("run/clientGameTest/saves")

	doLast {
		def saves = savesDir.get().asFile
		if (saves.exists()) {
			int stale = (saves.listFiles() ?: new File[0]).length
			delete saves
			logger.lifecycle("gametest preflight: cleared $stale world(s) from last run")
		}

		if (!org.gradle.internal.os.OperatingSystem.current().isWindows()) {
			logger.lifecycle("gametest preflight: no VRAM guard on this OS, skipping")
			return
		}
		def process = new ProcessBuilder("powershell", "-NoProfile", "-ExecutionPolicy", "Bypass",
				"-File", script.absolutePath)
				.directory(projectDir)
				.inheritIO()
				.start()
		if (process.waitFor() != 0) {
			throw new GradleException("gametest preflight refused to start the client — see its message above")
		}
	}
}

tasks.matching { it.name == "runClientGameTest" }.configureEach { t ->
	if (findProperty("skipGametestPreflight") == null) {
		dependsOn "gametestPreflight"
	}
	def only = findProperty("cobbieTests")
	if (only) {
		t.jvmArgs "-Dcobbie.gametests=${only}"
	}
	// A -D on the gradle command line reaches the daemon, not the client JVM this task launches, so
	// the history-seeding regime is forwarded the same way the class filter is.
	def seed = findProperty("cobbieSeed")
	if (seed) {
		t.jvmArgs "-Dcobbie.seedExchanges=${seed}"
	}
	def repair = findProperty("cobbieRepair")
	if (repair) {
		t.jvmArgs "-Dcobbie.repair=${repair}"
	}
	// 0.17.0: the suite talks to a real model. Let the surrounding environment supply one without any
	// key reaching a file: the same COBBIE_* variables the mod reads at runtime.
	if (t instanceof JavaExec) {
		['COBBIE_PROVIDER', 'COBBIE_BASE_URL', 'COBBIE_MODEL', 'COBBIE_API_KEY'].each { key ->
			def value = System.getenv(key)
			if (value != null && !value.isBlank()) t.environment(key, value)
		}
	}
}

// Tests are expected in src/gametest/java (Loom creates that source set, not src/clientGameTest).

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// MC 26.3 runs on Java 25 (deps like GeckoLib are compiled for 25)
	it.options.release = 25
}

java {
	// Loom will attach sources automatically in a later MC
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
